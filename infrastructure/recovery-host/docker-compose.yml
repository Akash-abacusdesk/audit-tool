name: platform-recovery

networks:
  recovery:
    driver: bridge
    internal: true

volumes:
  vaultwarden-data:

services:
  vaultwarden:
    image: vaultwarden/server:1.32.7-alpine
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:?set in recovery-host/.env}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?set in recovery-host/.env}
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
      LOG_LEVEL: ${VAULTWARDEN_LOG_LEVEL:-warn}
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: "80"
      ROCKET_WORKERS: ${VAULTWARDEN_WORKERS:-10}
      DATA_FOLDER: /data
    ports:
      - "${VAULTWARDEN_BIND_IP:?bind only loopback or WireGuard IP}:${VAULTWARDEN_HOST_PORT:-8080}:80"
    volumes:
      - vaultwarden-data:/data
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [recovery]
    restart: unless-stopped
