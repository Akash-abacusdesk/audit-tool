name: platform-recovery

# Vaultwarden is no longer hosted here — it is an external microservice,
# reached only through the control plane's private API client (PRD §3, §4.2).
# This host's job is PostgreSQL backup/WAL reception + recovery tooling only.

networks:
  recovery:
    driver: bridge
    internal: true

services:
  # Continuously streams WAL from the primary via the PostgreSQL replication
  # protocol (native `pg_receivewal`, no custom code) into ./wal, which
  # bin/backup-recovery-host.sh then ships to the Restic repository.
  wal-receiver:
    image: postgres:17-alpine
    environment:
      PGHOST: ${PRIMARY_PG_HOST:?set in recovery-host/.env}
      PGPORT: ${PRIMARY_PG_PORT:-5432}
      PGUSER: ${PRIMARY_PG_REPLICATION_USER:?set in recovery-host/.env}
      PGPASSWORD: ${PRIMARY_PG_REPLICATION_PASSWORD:?set in recovery-host/.env}
    entrypoint:
      - pg_receivewal
      - --directory=/wal
      - --if-not-exists
      - --verbose
    volumes:
      - ./wal:/wal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [recovery]
    restart: unless-stopped
